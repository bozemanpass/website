# nginx server config for the static www.bozemanpass.com site.
# Copy the contents of site/ to /var/www/bozemanpass (or adjust root below).
# TLS: add certificates via certbot (`certbot --nginx -d www.bozemanpass.com -d bozemanpass.com`).

server {
    listen 80;
    listen [::]:80;
    server_name bozemanpass.com www.bozemanpass.com;
    return 301 https://www.bozemanpass.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bozemanpass.com;

    root /var/www/bozemanpass;
    index index.html;

    # ssl_certificate     /etc/letsencrypt/live/www.bozemanpass.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.bozemanpass.com/privkey.pem;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Old WordPress endpoints that no longer exist.
    location ~ ^/(feed|comments/feed)/?$ { return 301 /articles/; }
    location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json) { return 410; }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|woff2?|ttf|eot|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
